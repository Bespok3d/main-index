name: Register atoms in the Bespok3d index
description: Register built atoms directly or submit them to Bespok3d/main-index by pull request.
author: Bespok3d
branding:
  icon: upload-cloud
  color: purple

# The Bespok3d-specific half of an atom repo's release. b3-builder itself stays org-agnostic (THE HARD
# BOUNDARY, ADR-0041): it builds atoms and knows nothing about who publishes them or where they land.
# This action is the other side of that seam, and it lives HERE because it is allowed to know exactly
# one thing the tool must not: this index-of-lists is Bespok3d/main-index. That is hardcoded below on
# purpose, not passed in.
#
# Org repos register directly. A contributor explicitly selects pull-request submission and supplies
# their own token, which can create or use their fork but cannot write to this upstream repository.

inputs:
  token:
    description: a token with write access to Bespok3d/main-index (repo secret MAIN_INDEX_TOKEN)
    required: false
  contributor-token:
    description: contributor-owned token with permission to create or use a fork and open a pull request
    required: false
  submission:
    description: direct or pull-request
    required: false
    default: direct
  atoms-dir:
    description: dir holding the built *.atom.json files, relative to the checkout (the b3-builder out dir)
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Validate registration mode
      shell: bash
      env:
        B3D_SUBMISSION: ${{ inputs.submission }}
        MAIN_INDEX_TOKEN: ${{ inputs.token }}
        CONTRIBUTOR_TOKEN: ${{ inputs.contributor-token }}
      run: |
        set -euo pipefail
        case "$B3D_SUBMISSION" in
          direct) [ -n "$MAIN_INDEX_TOKEN" ] || { echo "direct submission requires token" >&2; exit 1; } ;;
          pull-request)
            [ -n "$CONTRIBUTOR_TOKEN" ] || { echo "pull-request submission requires contributor-token" >&2; exit 1; }
            [ -z "$MAIN_INDEX_TOKEN" ] || { echo "pull-request submission must not receive the upstream token" >&2; exit 1; }
            ;;
          *) echo "submission must be direct or pull-request" >&2; exit 1 ;;
        esac
    - name: Commit the built atoms into the index
      if: inputs.submission == 'direct'
      shell: bash
      env:
        MAIN_INDEX_TOKEN: ${{ inputs.token }}
        B3D_ATOMS_DIR: ${{ inputs.atoms-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        atoms=("$B3D_ATOMS_DIR"/*.atom.json)
        [ ${#atoms[@]} -gt 0 ] || { echo "no *.atom.json in ${B3D_ATOMS_DIR}; nothing to register" >&2; exit 1; }
        workdir="$(mktemp -d)"
        # Full clone (no --depth 1) so a rebase on a concurrent push from another plugin repo has the
        # history it needs. Several repos release into this one index and they do collide.
        # --branch main: the atom has to land on the branch assembly and the app read, not on whatever
        # the repo's default branch happens to be.
        git clone --branch main "https://x-access-token:${MAIN_INDEX_TOKEN}@github.com/Bespok3d/main-index.git" "$workdir"
        cp "${atoms[@]}" "$workdir/atoms/"
        cd "$workdir"
        git config user.name "bespok3d-bot"
        git config user.email "bot@bespok3d.local"
        git add atoms/
        if git diff --cached --quiet; then
          echo "atoms unchanged; nothing to commit"
          exit 0
        fi
        git commit -m "update atoms from ${GITHUB_REPOSITORY##*/}"
        for attempt in 1 2 3 4 5; do
          git push && { echo "pushed main-index (attempt ${attempt})"; exit 0; }
          [ "$attempt" = 5 ] && { echo "main-index push failed after ${attempt} attempts" >&2; exit 1; }
          echo "main-index push rejected; rebasing on remote main (attempt ${attempt})"
          git pull --rebase --no-edit origin main
        done
    - name: Obtain the pinned builder core for prospective assembly
      if: inputs.submission == 'pull-request'
      uses: Bespok3d/b3-builder/.github/actions/core@c0180cb4f5cb1080bae1e425696a43539eaac906
      id: builder-core
    - name: Submit validated atoms from the contributor fork
      if: inputs.submission == 'pull-request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.contributor-token }}
        B3D_ATOMS_DIR: ${{ inputs.atoms-dir }}
        B3D_BUILDER_CORE_ROOT: ${{ steps.builder-core.outputs.core-root }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        atoms_dir="$(realpath "$B3D_ATOMS_DIR")"
        atoms=("$atoms_dir"/*.atom.json)
        [ ${#atoms[@]} -gt 0 ] || { echo "no *.atom.json in ${B3D_ATOMS_DIR}; nothing to submit" >&2; exit 1; }
        fork_owner="$(gh api user --jq .login)"
        fork_owner_id="$(gh api user --jq .id)"
        [ -n "$fork_owner" ] || { echo "contributor token has no GitHub owner" >&2; exit 1; }
        fork_repo="${fork_owner}/main-index"
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        git clone --branch main https://github.com/Bespok3d/main-index.git "$scratch/main-index"
        ln -s "$B3D_BUILDER_CORE_ROOT" "$scratch/b3-builder"
        branch="atom-submission/${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        cd "$scratch/main-index"
        git switch -c "$branch"
        cp "${atoms[@]}" atoms/
        env -u REGISTRY_SIGNING_KEY node scripts/assemble.mjs
        git restore -- index.json index.json.sig
        git config user.name "$fork_owner"
        git config user.email "${fork_owner_id}+${fork_owner}@users.noreply.github.com"
        git add atoms/
        if git diff --cached --quiet; then
          echo "atoms unchanged; nothing to submit"
          exit 0
        fi
        git commit -s -m "submit atoms from ${GITHUB_REPOSITORY}"
        if ! gh api "repos/${fork_repo}" --jq .full_name >/dev/null 2>&1; then
          gh repo fork Bespok3d/main-index --clone=false --remote=false
        fi
        fork_parent="$(gh api "repos/${fork_repo}" --jq .parent.full_name)"
        [ "$fork_parent" = Bespok3d/main-index ] || { echo "${fork_repo} is not a fork of Bespok3d/main-index" >&2; exit 1; }
        git remote add contributor "https://x-access-token:${GH_TOKEN}@github.com/${fork_repo}.git"
        existing_branch="$(git ls-remote contributor "refs/heads/${branch}" | cut -f1)"
        git push "--force-with-lease=refs/heads/${branch}:${existing_branch}" contributor "HEAD:refs/heads/${branch}"
        gh pr create --repo Bespok3d/main-index --base main --head "${fork_owner}:${branch}" \
          --title "Submit atoms from ${GITHUB_REPOSITORY}" \
          --body "Generated atoms from ${GITHUB_REPOSITORY}. Prospective index assembly passed."
