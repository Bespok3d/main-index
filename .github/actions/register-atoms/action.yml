name: Register atoms in the Bespok3d index
description: Commit a plugin repo's built atoms into Bespok3d/main-index, so they appear in the published index.json.
author: Bespok3d
branding:
  icon: upload-cloud
  color: purple

# The Bespok3d-specific half of an atom repo's release. b3-builder itself stays org-agnostic (THE HARD
# BOUNDARY, ADR-0041): it builds atoms and knows nothing about who publishes them or where they land.
# This action is the other side of that seam, and it lives HERE because it is allowed to know exactly
# one thing the tool must not: this index-of-lists is Bespok3d/main-index. That is hardcoded below on
# purpose, not passed in.
#
# Candidate atoms enter dev through a PR; Live releases update main only after promotion.

inputs:
  token:
    description: MAIN_INDEX_TOKEN with contents write and pull requests write on Bespok3d/main-index
    required: true
  release-kind:
    description: Release membership, live, prerelease or draft
    default: live
  selected-ids:
    description: Space-separated IDs to register, other built units stay untouched
    required: true
  atoms-dir:
    description: dir holding the built *.atom.json files, relative to the checkout (the b3-builder out dir)
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Commit the built atoms into the index
      shell: bash
      env:
        MAIN_INDEX_TOKEN: ${{ inputs.token }}
        B3D_RELEASE_KIND: ${{ inputs.release-kind }}
        B3D_SELECTED_IDS: ${{ inputs.selected-ids }}
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ATOMS_DIR: ${{ inputs.atoms-dir }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        atoms=("$B3D_ATOMS_DIR"/*.atom.json)
        [ ${#atoms[@]} -gt 0 ] || { echo "no *.atom.json in ${B3D_ATOMS_DIR}; nothing to register" >&2; exit 1; }
        workdir="$(mktemp -d)"
        # Full clone (no --depth 1) so a rebase on a concurrent push from another plugin repo has the
        # history it needs. Several repos release into this one index and they do collide.
        # Candidate atoms land on dev; only a Live release changes the main catalog.
        index_branch=dev
        [ "$B3D_RELEASE_KIND" = live ] && index_branch=main
        git clone --branch "$index_branch" "https://x-access-token:${MAIN_INDEX_TOKEN}@github.com/Bespok3d/main-index.git" "$workdir"
        if [ "$index_branch" = dev ]; then
          candidate_branch="candidate/${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$workdir" switch -c "$candidate_branch"
        fi
        read -r -a selected_ids <<< "$B3D_SELECTED_IDS"
        node "$B3D_ACTION_PATH/../../../scripts/register-atoms.mjs" "$B3D_ATOMS_DIR" "$workdir/atoms" "$B3D_RELEASE_KIND" "${selected_ids[@]}"
        cd "$workdir"
        git config user.name "bespok3d-bot"
        git config user.email "bot@bespok3d.local"
        git add atoms/
        if git diff --cached --quiet; then
          echo "atoms unchanged; nothing to commit"
          exit 0
        fi
        git commit -m "update atoms from ${GITHUB_REPOSITORY##*/}"
        for attempt in 1 2 3 4 5; do
          if [ "$index_branch" = dev ]; then
            git push -u origin "$candidate_branch" && break
          else
            git push && { echo "pushed main-index (attempt ${attempt})"; exit 0; }
          fi
          [ "$attempt" = 5 ] && { echo "main-index push failed after ${attempt} attempts" >&2; exit 1; }
          echo "main-index push rejected; rebasing on remote ${index_branch} (attempt ${attempt})"
          git pull --rebase --no-edit origin "$index_branch"
        done
        if [ "$index_branch" = dev ]; then
          gh pr create --repo Bespok3d/main-index --base dev --head "$candidate_branch" \
            --title "Candidate atoms from ${GITHUB_REPOSITORY##*/}" \
            --body "Merge to assemble the signed dev catalog for Staging."
        fi
