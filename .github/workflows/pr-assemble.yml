name: prospective-tier-assembly
on:
  pull_request:
    branches: [dev]
    paths:
      - atoms/**
      - lists/**
      - scripts/**
      - .github/workflows/pr-assemble.yml
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-index
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: Bespok3d/b3-builder/.github/actions/core@9322144c063a621191fe50951c803c6f79227277
        id: builder-core
      - name: Place the built core beside main-index
        run: ln -sfn "${{ steps.builder-core.outputs.core-root }}" b3-builder
      - name: Validate the prospective dev index assembly without publication credentials
        working-directory: main-index
        run: |
          node scripts/assemble.mjs
          test -s index.json
          node --test scripts/release-kind.test.mjs
