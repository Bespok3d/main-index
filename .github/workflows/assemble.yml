name: assemble-index

# When an atom changes (a plugin's CI commits atoms/<name>.atom.json), rebuild the published
# index.json from all atoms and commit it. The app fetches this index.json. index.json is at the
# repo root (not under atoms/), so committing it does not re-trigger this workflow.
#
# Both branches are listed on purpose. A plugin's release job pushes its atom to this repo's DEFAULT
# branch, which is dev, and the app reads the default branch too, so an atom that landed on dev with
# this workflow watching main alone left index.json pointing at release assets that had already been
# replaced, and the app got a 404 on every install of those plugins.
on:
  push:
    branches: [main, dev]
    paths:
      - atoms/**
      - lists/**
      - scripts/assemble.mjs
      - .github/workflows/assemble.yml
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-index
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # b3-builder is private, so actions/checkout cannot fetch it: this repo's GITHUB_TOKEN is scoped
      # to this repo alone and the checkout dies with "Repository not found". `uses:` is the reach the
      # org Actions access setting does permit, so the core arrives as an action the runner fetches.
      - uses: Bespok3d/b3-builder/.github/actions/core@68f258d18bac6809acba3f27048bbd691ec6f814  # main @ 2026-07-21
        id: builder-core
      # assemble.mjs's importBuilderCore resolves ../../b3-builder/dist/core relative to its own repo
      # root, so the built core has to sit next to main-index, exactly like the local layout.
      - name: Place the built core beside main-index
        run: ln -sfn "${{ steps.builder-core.outputs.core-root }}" b3-builder
      - name: Commit index.json
        working-directory: main-index
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          git config user.name "bespok3d-bot"
          git config user.email "bot@bespok3d.local"
          for attempt in 1 2 3 4 5; do
            node scripts/assemble.mjs
            # A missing REGISTRY_SIGNING_KEY makes assemble.mjs drop the signature and still succeed,
            # which would publish an index the app cannot verify while the run stayed green. Checking
            # only that a .sig EXISTS passes just as happily for a signature over different bytes,
            # which the app reads as tampering and refuses outright, so the check is the real one: the
            # signature has to verify over the exact bytes about to be committed, against the org
            # public key checked in under keys/.
            node scripts/verify-index.mjs
            git add -f index.json index.json.sig
            if git diff --cached --quiet; then
              echo "index unchanged; nothing to commit"
              break
            fi
            git commit -m "assemble index.json"
            git push && { echo "pushed index.json (attempt ${attempt})"; break; }
            [ "$attempt" = 5 ] && { echo "index.json push failed after ${attempt} attempts"; exit 1; }
            # Resync to the branch this run is assembling, never a hardcoded main: a hardcoded reset
            # on a dev run would discard the very atom commits that triggered it.
            echo "index.json push rejected; resyncing to remote ${GITHUB_REF_NAME} (attempt ${attempt})"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
