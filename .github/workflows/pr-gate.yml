name: pr-gate

# Every pull request and every push to dev or main runs this repo's own gate. main-index's gate reuses
# the shared detectors that live in lib_bespok3d, so that sibling is checked out beside this repo at the
# path check.sh expects (../lib_bespok3d). lib_bespok3d is public, so that checkout is anonymous and this
# gate holds no secret, which is what lets a pull request from a fork pass it.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-index
      - uses: actions/checkout@v4
        with:
          repository: Bespok3d/lib_bespok3d
          # Pinned to a commit, not a branch: the shared-tooling checkout must be immutable or whoever
          # can push to lib_bespok3d changes what this gate executes. Bump this SHA when the shared
          # detectors move. The workflow-pinning guard fails the gate on any non-40-hex ref here.
          ref: 94724bda4ce0fc13438460601a7177ec194bd12a
          path: lib_bespok3d
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The gate's tests sign and verify through b3-builder's core, which assemble.mjs imports from a
      # sibling b3-builder/ dir. It is reached through `uses:` at a pinned SHA and symlinked into place,
      # exactly as checks.yml and assemble.yml already do.
      - uses: Bespok3d/b3-builder/.github/actions/core@68f258d18bac6809acba3f27048bbd691ec6f814  # main @ 2026-07-21
        id: builder-core
      - name: Place the built core beside main-index
        run: ln -sfn "${{ steps.builder-core.outputs.core-root }}" b3-builder
      # Passed in because the sign/verify round trip SKIPS without a key, and a test that skips in CI
      # proves nothing about the key that actually signs the published index.
      #
      # A pull request from a fork gets an empty secrets context, so this is empty there and the round
      # trip skips, printing its reason. That is deliberate: a fork cannot be handed the signing key, and
      # the rest of the gate is the only check an outside contributor gets, so it still runs. A fork PR
      # being green therefore says the index assembles, NOT that the real key signs it. The push to main
      # is where that is proven, and nothing publishes from a fork PR.
      - name: Run the gate
        working-directory: main-index
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: bash scripts/check.sh
